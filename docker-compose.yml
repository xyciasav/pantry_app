services:
  pantry:
    image: "${PANTRY_IMAGE_NAME:-shelf-life}:${PANTRY_VERSION:-1.0.1}"
    build:
      context: .
      args:
        APP_VERSION: "${PANTRY_VERSION:-1.0.1}"
    container_name: shelf-life
    restart: unless-stopped
    ports:
      - "${PANTRY_PORT:-8000}:8000"
    environment:
      APP_VERSION: "${PANTRY_VERSION:-1.0.1}"
    volumes:
      - pantry-data:/data
volumes:
  pantry-data:
