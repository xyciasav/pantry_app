<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15352d">
  <title>{% block title %}Shelf Life{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">S</span><span>Shelf Life <b class="version-badge">v{{ app_version }}</b><small>Pantry & fridge</small></span></a>
    <nav class="top-actions">
      <a class="secondary-button" href="/locations">Locations</a>
      <a class="scan-button" href="/scan">▣ Scan</a>
      <a class="add-button" href="/items/new"><span>＋</span> Add item</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">Shelf Life <span>v{{ app_version }}</span></footer>
  {% block scripts %}{% endblock %}
</body>
</html>
